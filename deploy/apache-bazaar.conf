# Da aggiungere nel VirtualHost *:443 di blancostudio.dev
# (/etc/apache2/sites-enabled/blancostudio.dev-le-ssl.conf), accanto agli altri ProxyPass.
# I moduli proxy, proxy_http, headers e rewrite sono gia' abilitati sul server.
# Richiede sudo: fallo tu (vedi deploy/README.md). Non toccare le altre righe.

    # ── Bazaar ── l'app gestisce da se' il prefisso /bazaar (basePath di Next)
    ProxyPass /bazaar http://127.0.0.1:3210/bazaar timeout=300 flushpackets=on
    ProxyPassReverse /bazaar http://127.0.0.1:3210/bazaar
    # SSE della chat: niente compressione/buffering
    <Location /bazaar/api/chat>
        SetEnv no-gzip 1
        SetEnv proxy-sendchunked 1
    </Location>
