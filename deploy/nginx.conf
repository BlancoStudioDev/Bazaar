# /etc/nginx/sites-available/@APP_DOMAIN@  (deploy.sh --install-unit sostituisce @APP_DOMAIN@)
#
# PRIMO AVVIO: i certificati non esistono ancora e nginx -t fallirebbe. Ordine consigliato (vedi deploy/README.md):
#   1. usa temporaneamente solo il blocco "server :80" (commenta il blocco 443);
#   2. sudo certbot --nginx -d @APP_DOMAIN@   (certbot aggiunge/gestisce i certificati);
#   3. ripristina questo file completo e: sudo nginx -t && sudo systemctl reload nginx

# Necessario per l'upgrade eventuale delle connessioni.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name @APP_DOMAIN@;

    # Challenge ACME per certbot --webroot (con --nginx non serve ma e' innocuo)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @APP_DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@APP_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@APP_DOMAIN@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Header di sicurezza (la CSP completa la gestisce l'app: qui solo il minimo sicuro)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 1m;

    # Chat in SSE: niente buffering, timeout lungo. L'app invia X-Accel-Buffering: no.
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # NON usare proxy_ignore_headers X-Accel-Buffering: l'header dell'app va rispettato.
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
